<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>받은편지함 (6) - 데모</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Segoe UI", sans-serif;
    color: #202124;
    background: #fff;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 20px; border-bottom: 1px solid #e8eaed;
  }
  .logo { font-size: 20px; font-weight: 500; color: #5f6368; }
  .search {
    flex: 1; max-width: 640px; background: #eaf1fb; border-radius: 8px;
    padding: 9px 16px; color: #80868b; font-size: 14px;
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: #1a73e8; color: #fff; display: grid; place-items: center;
    font-size: 13px; font-weight: 600;
  }
  .toolbar {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 20px; color: #5f6368; font-size: 13px;
    border-bottom: 1px solid #f1f3f4;
  }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  tr.zA { border-bottom: 1px solid #f1f3f4; cursor: pointer; height: 40px; }
  tr.zA:hover { box-shadow: inset 0 -1px 0 #dadce0, 0 1px 3px rgba(60,64,67,.25); z-index: 1; }
  tr.zA.zE { background: #fff; font-weight: 600; }
  tr.zA.yO { background: #f2f6fc; }
  td.xY { padding: 0 6px; vertical-align: middle; }
  td.PF { width: 40px; padding-left: 16px; }
  td.apU { width: 28px; }
  td.yX { width: 200px; overflow: hidden; white-space: nowrap; }
  td.a4W { overflow: hidden; }
  td.xW { width: 90px; text-align: right; padding-right: 20px; color: #5f6368; font-size: 12px; }
  .aXw { display: inline-block; width: 18px; height: 18px; color: #dadce0; }
  .bA4 { color: #202124; }
  .xT { display: flex; gap: 6px; overflow: hidden; white-space: nowrap; }
  .y6 { flex: 0 0 auto; max-width: 46%; overflow: hidden; text-overflow: ellipsis; }
  .y2 { color: #5f6368; font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
  .nav {
    border: 0; background: transparent; color: #5f6368; font-size: 18px;
    cursor: pointer; padding: 0 6px;
  }
  #detail { padding: 16px 20px; }
  #detail h2 { font-size: 20px; font-weight: 400; margin: 12px 0; }
  .note {
    padding: 14px 20px; color: #80868b; font-size: 12.5px;
    border-top: 1px solid #f1f3f4; background: #fafafa;
  }
</style>
</head>
<body>

<header>
  <span class="logo">메일</span>
  <div class="search">메일 검색</div>
  <div class="avatar">데</div>
</header>

<div class="toolbar">
  <input type="checkbox" aria-label="모두 선택">
  <span>새로고침</span>
  <span id="range"></span>
  <button id="prev" class="nav" type="button" aria-label="이전 페이지">&lsaquo;</button>
  <button id="next" class="nav" type="button" aria-label="다음 페이지">&rsaquo;</button>
</div>

<div id="list">
  <table>
    <tbody id="rows"></tbody>
  </table>
</div>

<div id="detail" hidden>
  <button id="back" class="nav" type="button" aria-label="목록으로">&larr;</button>
  <h2 id="detail-subject"></h2>
</div>

<p class="note">
  시연용 화면입니다. 실제 메일이 아니며 모든 이름과 주소는 가상입니다.
</p>

<script src="inbox.js"></script>
<script>
// 손으로 볼 때는 누른 행을 읽음으로만 바꾼다. 목록이 사라지지 않는 화면에서도 확장의 여는
// 클릭 감지가 도는지 볼 수 있다. 시나리오 시험은 다른 열기 방식을 쓴다
nmtFixture.start({ openMode: 'read' });
</script>

</body>
</html>
